[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptocore"
version = "0.1.0"
description = "Учебный инструмент для шифрования файлов AES-128 в режиме ECB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.20,<4"
]

[project.scripts]
cryptocore = "cryptocore.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]